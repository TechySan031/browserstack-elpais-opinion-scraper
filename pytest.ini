[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Logging configuration — clean output for demos
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
log_cli_date_format = %H:%M:%S

# Markers for selective execution
markers =
    e2e: End-to-end tests requiring a browser (Selenium)
    unit: Unit tests with no external dependencies
